[project]
name = "fusball"
version = "0.1.0"
description = "Fusball phone API for match operations and leaderboards"
requires-python = ">=3.11"
dependencies = [
	"Flask>=3.0,<4",
	"trueskill==0.4.5",
	"psycopg[binary]>=3.2,<4",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["F403", "F405"]

[tool.ruff.lint.per-file-ignores]
"demo/demo.py" = ["E402"]
